name: Release

# Publishing is deliberate: push a tag that matches the version in package.json.
#
#   npm version patch     # bumps package.json and creates the tag
#   git push --follow-tags
#
# `workflow_dispatch` is the escape hatch for re-running a failed publish; it
# will refuse if that version is already on the registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: the signed attestation linking the published
  # tarball to this workflow run and this commit.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      # Node 22 and a current npm are what Trusted Publishing needs (npm
      # >= 11.5.1, Node >= 22.14). Node 22 still ships npm 10.x, so the upgrade
      # is explicit rather than assumed. The token path works on any version;
      # this keeps both open.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Pin the floor, not the top. `npm@latest` is a moving target: npm 12
      # changed the `pack --json` shape and requires a newer Node than this
      # runner installs. `^11.5.1` is the documented OIDC minimum and runs on
      # Node 22.
      - name: Use an npm that supports OIDC publishing
        run: npm install -g npm@^11.5.1

      - run: npm --version

      - run: npm ci

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, and npm has no undo. Fail here instead.
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - name: Refuse to republish an existing version
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published — bump the version" >&2
            exit 1
          fi

      - name: Lint and typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify the published package
        run: npm run verify:pack

      # Works both ways. With an NPM_TOKEN secret it authenticates with the
      # token and `--provenance` produces the attestation. Once Trusted
      # Publishing is configured for this package, npm detects the OIDC
      # environment on its own, the token is ignored, and provenance is
      # automatic — the flag stays harmless.
      #
      # `prepublishOnly` re-runs the full verify here. The pack test inside it
      # would repeat the job above for several minutes, so it is skipped —
      # `verify:pack` already ran, on this exact commit.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SKIP_PACK_TEST: '1'

      - name: Summary
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### Published \`@vinihcrosa/lumem@$version\`"
            echo
            echo '```bash'
            echo "npx @vinihcrosa/lumem@$version init"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
